<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配送管理 - Delivery Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">🚚 配送管理</h1>

    <!-- 配送一覧テーブル -->
    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>送り状番号</th>
            <th>受取人名</th>
            <th>ステータス</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="delivery : ${deliveries}">
            <td th:text="${delivery.trackingNumber}"></td>
            <td th:text="${delivery.recipientName}"></td>
            <td>
                <span th:if="${delivery.status.name() == 'PENDING'}" class="badge bg-warning text-dark">集荷待ち</span>
                <span th:if="${delivery.status.name() == 'DELIVERED'}" class="badge bg-success">配達完了</span>
            </td>
            <td>
                <form th:if="${delivery.status.name() == 'PENDING'}"
                      th:action="@{/deliveries/{id}/complete(id=${delivery.id})}"
                      method="post" style="display:inline;">
                    <button type="submit" class="btn btn-success btn-sm">配達完了にする</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- 新規登録フォーム -->
    <div class="card mt-4">
        <div class="card-header">新規登録フォーム</div>
        <div class="card-body">
            <form action="/deliveries" method="post">
                <div class="mb-3">
                    <label for="recipientName" class="form-label">受取人名</label>
                    <input type="text" class="form-control" id="recipientName"
                           name="recipientName" required>
                </div>
                <div class="mb-3">
                    <label for="recipientAddress" class="form-label">届け先住所</label>
                    <input type="text" class="form-control" id="recipientAddress"
                           name="recipientAddress" required>
                </div>
                <button type="submit" class="btn btn-primary">登録する</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
