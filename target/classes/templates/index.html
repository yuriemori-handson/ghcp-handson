<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4">🚚 配送管理</h1>

    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                    <tr>
                        <th>送り状番号</th>
                        <th>受取人名</th>
                        <th>ステータス</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="delivery : ${deliveries}">
                        <td th:text="${delivery.trackingNumber}"></td>
                        <td th:text="${delivery.recipientName}"></td>
                        <td>
                            <span th:text="${delivery.status.label}"></span>
                        </td>
                        <td>
                            <form th:if="${delivery.status.name() == 'PENDING'}"
                                  th:action="@{/deliveries/{id}/complete(id=${delivery.id})}"
                                  method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-primary">配達完了にする</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="h5 mb-3">新規登録フォーム</h2>
            <form th:action="@{/deliveries}" method="post">
                <div class="mb-3">
                    <label for="recipientName" class="form-label">受取人名</label>
                    <input id="recipientName" name="recipientName" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="recipientAddress" class="form-label">届け先住所</label>
                    <input id="recipientAddress" name="recipientAddress" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success">登録する</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
